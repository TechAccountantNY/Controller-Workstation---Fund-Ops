<style>
/* Layout: fixed ink header band with tab strip; one scrolling work surface beneath; exceptions as a stacked ledger of cards, each with its own decision form. */
:root{
  --paper:#f7f6f2; --card:#ffffff; --ink:#1b2430; --ink-2:#4a5565; --ink-3:#7a8494; --rule:#e2e0d9; --band:#1f3a5f; --band-fg:#f3f6fa;
  --accent:#2a6f97; --accent-fg:#ffffff;
  --crit:#b3261e; --crit-bg:#fbe9e7; --high:#b4530a; --high-bg:#fdefe3; --med:#8a6d00; --med-bg:#fbf3d5; --low:#3b6e3b; --low-bg:#e6f1e6; --info:#4a5565; --info-bg:#eceef2;
  --ok:#2f7d4f; --ok-bg:#e4f3ea;
  --display:"Source Serif 4",Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15191f; --card:#1d232b; --ink:#e8ebef; --ink-2:#b3bbc7; --ink-3:#7f8894; --rule:#2d3540; --band:#101c2d; --band-fg:#e8eef6;
  --accent:#6fb0d6; --accent-fg:#0d1a26;
  --crit:#ff8a80; --crit-bg:#3a1f1d; --high:#ffb074; --high-bg:#3a2816; --med:#e6c75a; --med-bg:#36301a; --low:#8fd19a; --low-bg:#1c2f1f; --info:#b3bbc7; --info-bg:#262c35;
  --ok:#7fd49a; --ok-bg:#1b3324; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#15191f; --card:#1d232b; --ink:#e8ebef; --ink-2:#b3bbc7; --ink-3:#7f8894; --rule:#2d3540; --band:#101c2d; --band-fg:#e8eef6;
  --accent:#6fb0d6; --accent-fg:#0d1a26;
  --crit:#ff8a80; --crit-bg:#3a1f1d; --high:#ffb074; --high-bg:#3a2816; --med:#e6c75a; --med-bg:#36301a; --low:#8fd19a; --low-bg:#1c2f1f; --info:#b3bbc7; --info-bg:#262c35;
  --ok:#7fd49a; --ok-bg:#1b3324; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);color:var(--band-fg)}
.hwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 0;max-width:1240px;margin:0 auto}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.brand .sub{color:var(--band-fg);opacity:.75;font-size:13px}
.brand .await{margin-left:auto;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--band-fg);opacity:.72;font:inherit;font-weight:500;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button:hover{opacity:1}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:var(--band-fg)}
nav button:focus-visible{outline:2px solid var(--band-fg);outline-offset:-2px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px;max-width:1240px;margin:0 auto}
section[role=tabpanel]{display:grid;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
p{margin:0}
.lede{color:var(--ink-2);max-width:68ch}
.lede strong{color:var(--ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:grid;gap:2px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--ink-2)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.m{font-family:var(--mono);font-size:12px}
tfoot td{font-weight:600;background:var(--paper)}
.muted{color:var(--ink-3)}
.wrap{min-width:0;overflow-wrap:anywhere}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.sev-critical{background:var(--crit-bg);color:var(--crit)} .sev-high{background:var(--high-bg);color:var(--high)} .sev-medium{background:var(--med-bg);color:var(--med)} .sev-low{background:var(--low-bg);color:var(--low)} .sev-info{background:var(--info-bg);color:var(--info)}
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-bad{background:var(--crit-bg);color:var(--crit)} .st-warn{background:var(--med-bg);color:var(--med)} .st-info{background:var(--info-bg);color:var(--info)}

/* exceptions */
.boundary{border-left:3px solid var(--accent);padding:8px 12px;color:var(--ink-2);font-size:13px;background:var(--card)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.exc{background:var(--card);border:1px solid var(--rule);border-radius:6px}
.exc > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.exc > summary::-webkit-details-marker{display:none}
.exc > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.exc .rank{font-family:var(--mono);color:var(--ink-3);font-size:13px;padding-top:2px}
.exc .ttl{font-weight:600;font-size:15px}
.exc .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--ink-2);align-items:center}
.exc .meta .amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.exc .body{padding:0 14px 14px;border-top:1px solid var(--rule);display:grid;gap:12px;padding-top:12px}
.exc .detail{max-width:80ch}
.exc ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px}
.exc .ev{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px}
.exc .ev code{font-family:var(--mono);background:var(--paper);border:1px solid var(--rule);padding:1px 6px;border-radius:3px;font-size:11px}
.exc .rec{background:var(--paper);border-radius:4px;padding:8px 10px;font-size:13px}
.exc .rec b{color:var(--ink)}
.log{display:grid;gap:6px}
.dec{border:1px solid var(--rule);border-left:4px solid var(--ok);background:var(--ok-bg);border-radius:4px;padding:8px 10px;font-size:13px;display:grid;gap:2px}
.dec .who{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.dec .disp{font-weight:600;letter-spacing:.04em}
.dec .when{color:var(--ink-3);font-family:var(--mono);font-size:11px}
form.decide{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center;border-top:1px dashed var(--rule);padding-top:12px}
form.decide label{font-size:12px;color:var(--ink-2)}
form.decide select,form.decide input,form.decide textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--card);color:var(--ink);width:100%}
form.decide textarea{resize:vertical;min-height:56px}
form.decide select:focus,form.decide input:focus,form.decide textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
form.decide .act{grid-column:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:13px;padding:7px 12px;background:var(--card);color:var(--accent);border:1px solid var(--accent);border-radius:4px;cursor:pointer}
form.decide button{font:inherit;font-weight:600;font-size:13px;padding:8px 14px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:4px;cursor:pointer}
form.decide button:disabled{opacity:.5;cursor:default}
form.decide .msg{font-size:12px;color:var(--ink-2)}
form.decide .msg.err{color:var(--crit)}
.ro{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--rule);padding-top:10px}
@media (max-width:560px){ form.decide{grid-template-columns:1fr} form.decide .act{grid-column:1} .exc > summary{grid-template-columns:1fr} .exc .meta{grid-column:1} }

/* decision log */
.state{font-size:12px;color:var(--ink-3)}
.empty{border:1px dashed var(--rule);border-radius:6px;padding:28px;text-align:center;color:var(--ink-2)}
.docbody{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px;max-height:320px;overflow:auto}
details.doc{background:var(--card);border:1px solid var(--rule);border-radius:6px}
details.doc summary{padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:13px}
details.doc summary .s{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
details.doc .body{padding:0 12px 12px}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .dec{animation:in .25s ease-out} @keyframes in{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}} }
</style>

    <div class="tile"><span class="k">Complex NAV estimate</span><span class="v">${usd(complexSep.amount)}</span><span class="d">Aug close ${usd(complexAug.amount)}</span></div>
    <div class="tile"><span class="k">Master fund</span><span class="v">${usd(masterSep.amount)}</span><span class="d">Aug ${usd(masterAug.amount)}</span></div>
    <div class="tile"><span class="k">Cash outside NAV</span><span class="v">${usd(cash.amount)}</span><span class="d">subscriptions not allotted</span></div>
    <div class="tile"><span class="k">Disclosed range</span><span class="v">${usd(range.amount)}</span><span class="d">Stonebow opening dispute</span></div>
    <div class="tile"><span class="k">Exceptions</span><span class="v">${D.exceptions.length}</span><span class="d">${D.checks_passed.length} explicit passes</span></div>
    <div class="tile"><span class="k">Awaiting a decision</span><span class="v" id="ov-await">${dbState==="loading"?"…":aw}</span><span class="d">${Object.entries(bySev).sort((a,b)=>sevRank[a[0]]-sevRank[b[0]]).map(([s,n])=>`${n} ${s}`).join(" · ")}</span></div>
  </div>
  <h3>Top of the queue</h3>
  <div class="tbl"><table><thead><tr><th>#</th><th>Severity</th><th>Exception</th><th class="n">Impact</th><th>Status</th></tr></thead><tbody>
  ${D.exceptions.slice(0,8).map(e=>{const ds=decisionsFor(e.key); return `<tr><td class="m">${e.rank}</td><td><span class="pill sev-${e.severity}">${e.severity}</span></td><td class="wrap"><a href="#exceptions" data-open="${esc(e.key)}">${esc(e.title)}</a></td><td class="n">${usd(e.amount_impact_usd)}</td><td>${ds.length?`<span class="pill st-ok">${esc(ds[ds.length-1].disposition)}</span>`:(e.decision_required?`<span class="pill st-warn">decision required</span>`:`<span class="pill st-info">open</span>`)}</td></tr>`;}).join("")}
  </tbody></table></div>
  <h3>Vehicles</h3>
  <div class="tbl"><table><thead><tr><th>Vehicle</th><th class="n">Aug NAV</th><th class="n">Sep estimate</th><th class="n">Return</th><th class="n">Cash held unallotted</th></tr></thead><tbody>
  ${D.rollforward_vehicles.map(v=>`<tr><td>${esc(v.vehicle)}</td><td class="n">${usd(v.aug_nav)}</td><td class="n">${usd(v.sep_nav_estimate)}</td><td class="n">${pct(v.sep_return_pct)}</td><td class="n">${usd(v.cash_held_unallotted)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function vExceptions(){
  const list = D.exceptions.filter(e=>sevFilter==="all"||e.severity===sevFilter);
  const sevs = ["all","critical","high","medium","low","info"];
  return `
  <div class="boundary"><b>Human in the loop.</b> The system proposes; a person disposes. Every disposition needs a name and a reason and is appended to the log — nothing is overwritten. ${DISP_HELP}</div>
  <div class="filters" role="group" aria-label="Filter by severity">${sevs.map(s=>`<button aria-pressed="${sevFilter===s}" data-sev="${s}">${s==="all"?`All ${D.exceptions.length}`:s}</button>`).join("")}<span class="state" id="dbstate"></span></div>
  ${list.map(e=>{
    const ds = decisionsFor(e.key);
    const ev = arr(e.evidence), fi = arr(e.findings);
    return `<details class="exc" id="exc-${cssKey(e.key)}" ${e.rank<=2?"open":""}>
      <summary><span class="rank">#${e.rank}</span><span class="ttl"><span class="pill sev-${e.severity}">${e.severity}</span> &nbsp;${esc(e.title)}</span>
        <span class="meta"><span>${esc(e.category)}</span><span>·</span><span class="amt">${usd(e.amount_impact_usd)}</span>${e.decision_required?`<span>·</span><span>decision required</span>`:""}${ds.length?`<span>·</span><span class="pill st-ok">${esc(ds[ds.length-1].disposition)}</span>`:""}</span></summary>
      <div class="body">
        <p class="detail">${esc(e.detail)}</p>
        ${fi.length?`<ul>${fi.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
        <div class="ev"><b>Evidence:</b> ${ev.map(x=>`<code>${esc(x)}</code>`).join("")}</div>
        <div class="rec"><b>Recommended:</b> ${esc(e.recommended_action)}</div>
        <div class="log">${ds.map(d=>`<div class="dec"><div class="who"><span class="disp">${esc(d.disposition)}</span><span>— ${esc(d.by)}</span><span class="when">${fmtWhen(d.at)}</span></div><div>${esc(d.why)}</div></div>`).join("")}</div>
        ${decideForm(e)}
      </div></details>`;}).join("")}`;
}
function cssKey(k){ return k.replace(/[^a-zA-Z0-9_-]/g,"_"); }
function decideForm(e){
  if(dbState==="offline") return `<div class="ro">Decisions can't be recorded in this view (the shared decision store isn't available). Open the page signed in to claude.ai to dispose.</div>`;
  if(dbState==="readonly") return `<div class="ro">You have view-only access to this workstation, so decisions are read-only here.</div>`;
  const k = cssKey(e.key);
  return `<form class="decide" data-key="${esc(e.key)}" data-title="${esc(e.title)}" data-rank="${e.rank}">
    <label for="disp-${k}">Disposition</label><select id="disp-${k}" name="disposition" required><option value="">Choose…</option>${DISPOSITIONS.map(d=>`<option>${d}</option>`).join("")}</select>
    <label for="by-${k}">Decided by</label><input id="by-${k}" name="by" placeholder="Name (role)" value="${esc(byName)}" required>
    <label for="why-${k}">Rationale</label><textarea id="why-${k}" name="why" placeholder="Required. Why — and what happens next." required></textarea>
    <div class="act"><button type="submit" ${dbState==="loading"?"disabled":""}>Record decision</button><span class="msg"></span></div>
  </form>`;
}

function vDecisions(){
  if(dbState==="loading") return `<h2>Decision log — append-only</h2><p class="state">Loading the shared decision log…</p>`;
  if(!decisions.length) return `<h2>Decision log — append-only</h2><div class="empty">No decisions recorded yet. Dispose an exception on the Exceptions tab and it will appear here with a name, a timestamp and a rationale.</div>`;
  return `<h2>Decision log — append-only</h2><p class="state">${decisions.length} entries · newest last · decisions you record here are saved in this browser</p><p><button type="button" id="csv" class="btn">Download decision log (CSV)</button></p>
  <div class="tbl"><table><thead><tr><th>#</th><th>When</th><th>Exception</th><th>Disposition</th><th>By</th><th>Rationale</th></tr></thead><tbody>
  ${decisions.map((d,i)=>`<tr><td class="m">${i+1}</td><td class="m" style="white-space:nowrap">${fmtWhen(d.at)}</td><td class="wrap"><a href="#exceptions" data-open="${esc(d.key)}">#${d.rank} ${esc(d.title)}</a></td><td><b>${esc(d.disposition)}</b></td><td>${esc(d.by)}</td><td class="wrap">${esc(d.why)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function vRollforward(){
  const s = D.rollforward_sleeves;
  const tot = f => s.reduce((a,r)=>a+(Number(r[f])||0),0);
  return `<h2>Roll-forward: sleeve → master → vehicle → complex</h2>
  <h3>Master sleeves</h3>
  <div class="tbl"><table><thead><tr><th>Sleeve</th><th class="n">Aug close</th><th class="n">Sep opening (mgr)</th><th class="n">Tie Δ</th><th class="n">Net return</th><th class="n">Sep closing (mgr)</th><th class="n">Estimate NAV</th><th class="n">P&amp;L</th><th>Basis</th><th>Conf.</th></tr></thead><tbody>
  ${s.map(r=>`<tr><td>${esc(r.sleeve)}</td><td class="n">${usd(r.aug_close_nav)}</td><td class="n">${usd(r.sep_opening_per_manager)}</td><td class="n" ${Number(r.opening_tie_diff)?'style="color:var(--crit)"':""}>${usd(r.opening_tie_diff)}</td><td class="n">${pct(r.net_return_pct)}</td><td class="n">${usd(r.sep_closing_per_manager)}</td><td class="n">${usd(r.estimate_nav)}</td><td class="n">${usd(r.pnl_estimate)}</td><td class="wrap muted">${esc(r.estimate_basis)}${r.range_usd?` · range ${usd(r.range_usd)}`:""}</td><td><span class="pill ${r.confidence==="high"?"st-ok":r.confidence==="low"?"st-bad":"st-warn"}">${esc(r.confidence)}</span></td></tr>`).join("")}
  </tbody><tfoot><tr><td>Σ sleeves</td><td class="n">${usd(tot("aug_close_nav"))}</td><td></td><td></td><td></td><td></td><td class="n">${usd(tot("estimate_nav"))}</td><td class="n">${usd(tot("pnl_estimate"))}</td><td></td><td></td></tr></tfoot></table></div>
  <h3>Master fund</h3>${kv(D.rollforward_master)}
  <h3>Vehicles</h3>
  <div class="tbl"><table><thead><tr><th>Vehicle</th><th class="n">Aug NAV</th><th class="n">Master own. %</th><th class="n">Master P&amp;L share</th><th class="n">Direct P&amp;L</th><th class="n">Subs</th><th class="n">Reds</th><th class="n">Admin fee</th><th class="n">Sep estimate</th><th class="n">Return</th><th>Basis</th></tr></thead><tbody>
  ${D.rollforward_vehicles.map(v=>`<tr><td>${esc(v.vehicle)}</td><td class="n">${usd(v.aug_nav)}</td><td class="n">${pct(v.master_ownership_pct_aug)}</td><td class="n">${usd(v.master_pnl_share)}</td><td class="n">${usd(v.direct_coinvest_pnl)}</td><td class="n">${usd(v.subscriptions)}</td><td class="n">${usd(v.redemptions)}</td><td class="n">${usd(v.admin_fee_accrual)}</td><td class="n">${usd(v.sep_nav_estimate)}</td><td class="n">${pct(v.sep_return_pct)}</td><td class="wrap muted">${esc(v.basis)}</td></tr>`).join("")}
  </tbody></table></div>
  <h3>Complex</h3>${kv(D.rollforward_complex)}`;
}
function kv(rows){
  const keys = Object.keys(rows[0]||{});
  return `<div class="tbl"><table><tbody>${rows.map(r=>`<tr><td class="wrap">${esc(r[keys[0]])}</td><td class="n">${/Share of/.test(r[keys[0]])?pct(r[keys[1]]):usd(r[keys[1]])}</td>${keys.slice(2).map(k=>`<td class="wrap muted">${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function vCapital(){
  return `<h2>Capital activity</h2>
  <div class="tbl"><table><thead><tr><th>Item</th><th>Kind</th><th>Investor</th><th>Vehicle</th><th class="n">Instructed</th><th class="n">Received</th><th class="n">Δ</th><th>Dealing</th><th>Value date</th><th>Signed doc</th><th>TA ack</th><th>Status</th><th>Cash location</th></tr></thead><tbody>
  ${D.capital_activity.map(c=>`<tr><td class="m">${esc(c.item)}</td><td>${esc(c.kind)}</td><td>${esc(c.investor)}</td><td>${esc(c.vehicle)}</td><td class="n">${usd(c.instructed)}</td><td class="n">${usd(c.received)}</td><td class="n" ${Number(c.difference)?'style="color:var(--crit)"':""}>${usd(c.difference)}</td><td class="m">${esc(c.dealing_date)}</td><td class="m">${esc(c.funds_value_date)}</td><td class="m wrap">${esc(c.signed_document)||"—"}</td><td class="m">${esc(c.ta_acknowledged)||"—"}</td><td><span class="pill ${/HELD|DEFER/.test(c.status)?"st-warn":/ALLOT|PROCESS/.test(c.status)?"st-ok":"st-info"}">${esc(c.status)}</span></td><td class="wrap muted">${esc(c.cash_location)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function vArrivals(){
  const cls = s => /DOES NOT MATCH|OVERDUE/.test(s)?"st-bad":/RECEIVED/.test(s)?"st-ok":"st-warn";
  return `<h2>Expected arrivals</h2><p class="lede">Derived, not typed: one statement per sleeve, one valuation per direct position, one acknowledgement per instruction, one bank statement per cash balance, plus our own deliverables.</p>
  <div class="tbl"><table><thead><tr><th>Item</th><th>Kind</th><th>Counterparty</th><th>Expected by</th><th>Received</th><th>Document</th><th>Status</th><th>Quality</th></tr></thead><tbody>
  ${D.arrivals.map(a=>`<tr><td class="wrap">${esc(a.item)}</td><td>${esc(a.kind)}</td><td>${esc(a.counterparty)}</td><td class="m">${esc(a.expected_by)}</td><td class="m">${esc(a.received_on)||"—"}</td><td class="m wrap">${esc(a.document)||"—"}</td><td><span class="pill ${cls(a.status)}">${esc(a.status)}</span></td><td class="wrap muted">${esc(a.quality)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function vInbox(){
  return `<h2>Inbox — ${D.documents.length} messages, classified by named rule</h2>
  <div class="tbl"><table><thead><tr><th>Sent</th><th>From</th><th>Subject</th><th>Category</th><th>Counterparty</th><th>Attachment</th></tr></thead><tbody>
  ${D.documents.map(d=>`<tr><td class="m">${esc(d.sent)}</td><td class="wrap">${esc(d.sender)}</td><td class="wrap">${esc(d.subject)}</td><td><span class="pill st-info">${esc(d.category)}</span></td><td>${esc(d.counterparty)||"—"}</td><td class="m wrap">${esc(d.attachment)||"—"}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function vAssumptions(){
  return `<h2>Declared policies</h2><p class="lede">Each is a judgment call, declared with its reason in one place. Change one and the estimate moves; nothing is silently "fixed".</p>
  <div class="tbl"><table><thead><tr><th>Policy</th><th>Setting</th><th>Reason</th></tr></thead><tbody>
  ${D.assumptions.map(a=>`<tr><td class="m">${esc(a.key)}</td><td><b>${esc(a.statement)}</b></td><td class="wrap muted">${esc(a.reason)}</td></tr>`).join("")}
  </tbody></table></div>
  <h3>${D.checks_passed.length} explicit passes</h3>
  <div class="tbl"><table><thead><tr><th>Check</th><th>Subject</th><th>Detail</th><th>Evidence</th></tr></thead><tbody>
  ${D.checks_passed.map(c=>`<tr><td class="m">${esc(c.check)}</td><td>${esc(c.subject)}</td><td class="wrap">${esc(c.detail)}</td><td class="m wrap muted">${esc(c.evidence)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

// ---------- render ----------
const VIEWS = {overview:vOverview,exceptions:vExceptions,decisions:vDecisions,rollforward:vRollforward,capital:vCapital,arrivals:vArrivals,inbox:vInbox,assumptions:vAssumptions};
function render(){
  renderTabs();
  const cur=current();
  const main=$("#main");
  const openState = {}; main.querySelectorAll("details.exc").forEach(d=>openState[d.id]=d.open);
  main.innerHTML = `<section role="tabpanel" aria-labelledby="tab-${cur}">${VIEWS[cur]()}</section>`;
  main.querySelectorAll("details.exc").forEach(d=>{ if(d.id in openState) d.open=openState[d.id]; });
  const st=$("#dbstate"); if(st) st.textContent = dbState==="live"?"":dbState==="loading"?"connecting to the shared decision log…":"";
  $("#await").textContent = dbState==="loading"?"loading decisions…":`${awaiting()} exception${awaiting()===1?"":"s"} awaiting a decision`;
  main.querySelectorAll(".filters button[data-sev]").forEach(b=>b.addEventListener("click",()=>{sevFilter=b.dataset.sev;render();}));
  main.querySelectorAll("a[data-open]").forEach(a=>a.addEventListener("click",ev=>{ev.preventDefault();history.replaceState(null,"","#exceptions");sevFilter="all";render();const el=document.getElementById("exc-"+cssKey(a.dataset.open));if(el){el.open=true;el.scrollIntoView({block:"start",behavior:"smooth"});}}));
  main.querySelectorAll("form.decide").forEach(f=>f.addEventListener("submit",onDecide));
  const cb=$("#csv"); if(cb) cb.addEventListener("click",()=>{
    const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const rows=[["n","when_utc","rank","exception","disposition","decided_by","rationale"]].concat(decisions.map((d,i)=>[i+1,d.at,d.rank,d.title,d.disposition,d.by,d.why]));
    const blob=new Blob([rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="decision_log.csv"; document.body.appendChild(a); a.click(); a.remove();
  });
}

// ---------- decisions ----------
async function onDecide(ev){
  ev.preventDefault();
  const f=ev.currentTarget, msg=f.querySelector(".msg"), btn=f.querySelector("button");
  const disposition=f.disposition.value, by=f.by.value.trim(), why=f.why.value.trim();
  msg.className="msg";
  if(!disposition||!by||!why){ msg.textContent="Disposition, name and rationale are all required."; msg.classList.add("err"); return; }
  btn.disabled=true; msg.textContent="Recording…";
  const at=new Date().toISOString();
    const doc={key:f.dataset.key,title:f.dataset.title,rank:Number(f.dataset.rank),disposition,by,why,at};
  try{
    const adds=localAdds(); adds.push(doc); localStorage.setItem(LS,JSON.stringify(adds));
  }catch(e){ msg.textContent="This browser blocked saving (private window?). The decision is shown until you close the page."; msg.classList.add("err"); }
  decisions.push(doc);
  try{ localStorage.setItem("ws.by",by); }catch(e){}
  byName=by; render();
  const el=document.getElementById("exc-"+cssKey(doc.key)); if(el){ el.open=true; }
}

const LS="fundops.ws.decisions.v1";
function localAdds(){ try{ return JSON.parse(localStorage.getItem(LS)||"[]"); }catch(e){ return []; } }
function loadDecisions(){
  const seed=JSON.parse(document.getElementById("seeddec").textContent);
  decisions=seed.concat(localAdds()).sort((a,b)=>a.at<b.at?-1:1);
}
dbState="live"; loadDecisions(); render();
})();
</script>

</body></html>
